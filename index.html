<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <title>HarderBPM – Harder Styles Radio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
<a href="/" class="logo">
  <img src="harderbpm-logo.png" alt="HarderBPM">
</a>

    <div class="tagline">
      Feel the harder styles
    </div>
  </header>


  <main>

   <section class="hero">

  <div class="hero-content">

    <div class="hero-text-block">

      <p class="eyebrow">
        ONLINE HARDER STYLES RADIO
      </p>

      <h1>
        YOUR HARDER STYLES.<br>
        <span>ONE PLACE.</span>
      </h1>

      <p class="hero-text">
        Hardcore, Hardstyle, Uptempo en Frenchcore.<br>
        De beste harder styles radiostations.<br>
        24/7. Gratis. Overal.
      </p>

    </div>


    <div class="hero-image">
      <img
        src="koptelefoon-hero.png"
        alt=""
        aria-hidden="true"
      >
    </div>

  </div>

</section>


    <section class="stations">

      <h2>Listen now</h2>

      <div id="station-list">
        <!-- Stations worden hier door app.js geplaatst -->
      </div>

    </section>

  </main>


  <div class="player" id="player">

    <div class="player-info">
      <div class="player-dot"></div>

      <div>
        <div class="player-label">NOW PLAYING</div>
        <div id="player-station-name">Choose a station</div>
      </div>
    </div>

    <button id="player-button" class="player-button">
      ▶
    </button>

    <audio id="audio-player"></audio>

  </div>


  <script src="app.js"></script>

</body>
</html>
