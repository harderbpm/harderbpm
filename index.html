<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <title>HarderBPM – Harder Styles Radio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
<a href="/" class="logo">
  <img src="harderbpm-logo.png" alt="HarderBPM">
</a>

    <div class="tagline">
      Feel the harder styles
    </div>
  </header>


  <main>

   <section class="hero">

  <div class="hero-content">

    <div class="hero-text-block">

      <p class="eyebrow">
        ONLINE HARDER STYLES RADIO
      </p>

      <h1>
        YOUR HARDER STYLES.<br>
        <span>ONE PLACE.</span>
      </h1>

      <p class="hero-text">
        Hardcore, Hardstyle, Uptempo and Frenchcore.<br>
        The best harder styles radiostations.<br>
        24/7. Free. Everywhere.
      </p>

    </div>


    <div class="hero-image">
      <img
        src="koptelefoon-hero.png"
        alt=""
        aria-hidden="true"
      >
    </div>

  </div>

</section>


    <section class="stations">

      <h2>Listen now</h2>

      <div id="station-list">
        <!-- Stations worden hier door app.js geplaatst -->
      </div>

    </section>

  </main>


<div class="player" id="player">

  <div class="player-info">
    <div class="player-live-dot"></div>

    <div class="player-text">
      <div class="player-label">WE GAAN ERVOOR</div>
      <div id="player-station-name">Choose a station</div>
      <div id="player-station-genre" class="player-genre">
        Harder styles radio
      </div>
    </div>
  </div>

  <div class="player-controls">

    <button
      id="player-button"
      class="player-button"
      type="button"
      aria-label="Play or pause stream"
    >
      ▶
    </button>

  </div>

  <div class="player-volume">

    <span class="volume-icon">🔊</span>

    <input
      id="volume-slider"
      type="range"
      min="0"
      max="1"
      step="0.05"
      value="1"
      aria-label="Volume"
    >

  </div>

  <audio id="audio-player"></audio>

</div>


  <script src="app.js"></script>

</body>
</html>
