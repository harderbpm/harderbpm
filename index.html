<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HarderBPM – Harder Styles Radio</title>

  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

  <header class="site-header">
<a href="/" class="logo">
  <img src="harderbpm-logo.png" alt="HarderBPM">
</a>

    <div class="tagline">
      Feel the harder styles
    </div>
  </header>


  <main>

    <section class="hero">
      <p class="eyebrow">ONLINE HARDER STYLES RADIO</p>

      <h1>
        Your harder styles.<br>
        <span>One click away.</span>
      </h1>

      <p class="hero-text">
        Listen to the harder side of electronic music.
      </p>
    </section>


    <section class="stations">

      <h2>Listen now</h2>

      <div id="station-list">
        <!-- Stations worden hier door app.js geplaatst -->
      </div>

    </section>

  </main>


  <div class="player" id="player">

    <div class="player-info">
      <div class="player-dot"></div>

      <div>
        <div class="player-label">NOW PLAYING</div>
        <div id="player-station-name">Choose a station</div>
      </div>
    </div>

    <button id="player-button" class="player-button">
      ▶
    </button>

    <audio id="audio-player"></audio>

  </div>


  <script src="app.js"></script>

</body>
</html>
